name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests --select E9,F63,F7,F82
      - run: python scripts/check_publication.py
      - run: python -m pytest --cov=coreops_demo --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Build synthetic workbook
        run: |
          python -m coreops_demo.pipeline
          python -m coreops_demo.analysis
          python -m coreops_demo.weekly_report
      - name: Validate exported workbook
        run: python scripts/validate_exports.py
      - name: Check analytical reproducibility
        if: runner.os == 'Linux'
        run: git diff --exit-code -- data/processed analysis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            output/*.xlsx
            coverage.xml
            test-results.xml
          retention-days: 7
