name: validate-demo

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m coreops_demo.pipeline
      - run: pytest -q
      - name: Confirm generated dashboard data is committed
        run: git diff --exit-code -- data/processed
