[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coreops-noc-demo"
version = "1.1.0"
description = "Pipeline sintético, análise exploratória e dashboard para operações NOC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.8,<1", "matplotlib>=3.8,<4"]

[project.scripts]
coreops-demo = "coreops_demo.pipeline:main"
coreops-weekly-report = "coreops_demo.weekly_report:main"
coreops-analysis = "coreops_demo.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
